<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偶像广场 · 粉丝应援站</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg1: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
            --card: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.15);
            --gold1: #f6d365; --gold2: #fda085;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            color: #eee;
            padding-top: 70px;
        }
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(26,26,46,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 30px; z-index: 100;
        }
        nav .logo {
            font-weight: bold; font-size: 18px;
            background: linear-gradient(90deg, var(--gold1), var(--gold2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        nav .links { margin-left: auto; display: flex; gap: 20px; align-items: center; }
        nav .links a { color: #ddd; text-decoration: none; font-size: 14px; }
        nav .links a:hover, nav .links a.active { color: var(--gold1); }
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        h1 {
            text-align: center;
            background: linear-gradient(90deg, var(--gold1), var(--gold2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            font-size: 34px; margin-bottom: 8px;
        }
        .sub { text-align: center; color: #aaa; margin-bottom: 30px; }

        .add-btn {
            display: block; margin: 0 auto 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--gold1), var(--gold2));
            color: #1a1a2e; border: none; border-radius: 30px;
            font-size: 15px; font-weight: bold; cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }
        .idol-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform .3s;
        }
        .idol-card:hover { transform: translateY(-5px); }
        .idol-card .avatar {
            width: 100%; aspect-ratio: 1;
            object-fit: cover;
            background: rgba(0,0,0,0.3);
        }
        .idol-card .info { padding: 15px; }
        .idol-card .name {
            font-size: 18px; font-weight: bold;
            color: var(--gold1);
            margin-bottom: 6px;
        }
        .idol-card .desc {
            font-size: 13px; color: #ccc;
            line-height: 1.6;
            max-height: 60px; overflow: hidden;
        }
        .idol-card .actions {
            display: flex; gap: 8px; margin-top: 10px;
        }
        .idol-card .actions button {
            flex: 1; padding: 6px;
            background: rgba(255,255,255,0.1);
            color: #fff; border: 1px solid var(--border);
            border-radius: 8px; cursor: pointer; font-size: 12px;
        }
        .idol-card .actions .del { color: #ff6b6b; }

        /* 弹窗 */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center; justify-content: center;
            overflow-y: auto;
            padding: 24px 0;
            z-index: 200;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 90%; max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            background: linear-gradient(135deg, var(--bg2), var(--bg3));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
        }
        .modal h2 {
            color: var(--gold1); margin-bottom: 20px; font-size: 20px;
        }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 14px; color: #ccc; margin-bottom: 6px; }
        .field input, .field textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff; font-size: 14px;
            outline: none; font-family: inherit;
        }
        .field input:focus, .field textarea:focus { border-color: var(--gold1); }
        .field textarea { min-height: 80px; resize: vertical; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button {
            flex: 1; padding: 11px;
            border: none; border-radius: 20px;
            cursor: pointer; font-size: 15px; font-weight: bold;
        }
        .modal-actions .ok {
            background: linear-gradient(135deg, var(--gold1), var(--gold2));
            color: #1a1a2e;
        }
        .modal-actions .cancel {
            background: rgba(255,255,255,0.1); color: #fff;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">🌟 偶像广场</div>
        <div class="links">
            <a href="index.html">首页</a>
            <a href="album.html">相册</a>
            <a href="idols.html" class="active">偶像广场</a>
            <a href="text_format.html">文字特效</a>
            <a href="form.html">粉丝注册</a>
            <span id="userBox"></span>
        </div>
    </nav>

    <div class="container">
        <h1>🌟 我的偶像收藏墙</h1>
        <div class="sub">每个人都可以把自己喜欢的偶像加进来</div>

        <button class="add-btn" onclick="openModal()">➕ 添加我的偶像</button>

        <div class="grid" id="idolGrid"></div>
    </div>

    <!-- 添加弹窗 -->
    <div class="modal-mask" id="modalMask">
        <div class="modal">
            <h2>添加新偶像</h2>
            <div class="field">
                <label>偶像名字</label>
                <input type="text" id="newName" placeholder="例如：张三">
            </div>
                <div class="field">
                <label>照片链接（图片URL）</label>
                <input type="text" id="newPhoto" placeholder="粘贴图片网址，或留空用默认头像">
            </div>
            <div class="field">
                <label>学校 / 单位</label>
                <input type="text" id="newSchool" placeholder="例如：清华大学 / 影视圈 / 电子厂">
            </div>
            <div class="field">
                <label>职业 / 身份</label>
                <input type="text" id="newRole" placeholder="例如：学生 / 歌手 / 设计师">
            </div>
            <div class="field">
                <label>爱好 / 标签</label>
                <input type="text" id="newHobby" placeholder="例如：唱歌 / 旅行 / 电影 / 运动">
            </div>
            <div class="field">
                <label>生日（YYYY-MM-DD）</label>
                <input type="date" id="newBirthday">
            </div>
            <div class="field">
                <label>星座</label>
                <input type="text" id="newZodiac" placeholder="例如：天蝎座">
            </div>
            <div class="field">
                <label>微信</label>
                <input type="text" id="newWechat" placeholder="微信号">
            </div>
            <div class="field">
                <label>抖音</label>
                <input type="text" id="newDouyin" placeholder="@用户名">
            </div>
            <div class="field">
                <label>邮箱</label>
                <input type="text" id="newEmail" placeholder="邮箱地址">
            </div>
            <div class="field">
                <label>所在地</label>
                <input type="text" id="newLocation" placeholder="例如：西安 / 北京">
            </div>
            <div class="field">
                <label>一句话介绍</label>
                <textarea id="newDesc" placeholder="他/她最吸引你的点是什么？"></textarea>
            </div>
            <div class="field">
                <label>主页展示标题</label>
                <input type="text" id="newTitle" placeholder="例如：温柔又有光的人">
            </div>
            <div class="field">
                <label>状态 / 个人标签</label>
                <input type="text" id="newStatus" placeholder="例如：安静、清爽、自然">
            </div>
            <div class="field">
                <label>粉丝名</label>
                <input type="text" id="newFanName" placeholder="例如：键丝 / 小粉丝">
            </div>
            <div class="field">
                <label>特点</label>
                <input type="text" id="newFeature" placeholder="例如：眉眼清爽 / 笑容治愈">
            </div>
            <div class="field">
                <label>标签（展示在首页）</label>
                <input type="text" id="newLabel" placeholder="例如：校草 / 少年感">
            </div>
            <div class="modal-actions">
                <button class="cancel" onclick="closeModal()">取消</button>
                <button class="ok" onclick="addIdol()">添加</button>
            </div>
        </div>
    </div>

    <script>
        (function initUserBox() {
            const u = localStorage.getItem('currentUser');
            const box = document.getElementById('userBox');
            if (u) {
                box.innerHTML = `<span style="color:var(--gold1);font-size:14px;">你好，${u} 👋</span> <a href="javascript:void(0)" onclick="logout()" style="font-size:13px;">退出</a>`;
            } else {
                box.innerHTML = `<a href="login.html" style="font-size:14px;">登录/注册</a>`;
            }
        })();
        function logout() { localStorage.removeItem('currentUser'); location.reload(); }

        // 默认偶像
        const defaultIdols = [
            { name: '郑文键', photo: 'zwj.jpg', desc: '西信大校草，少年感拉满，眉眼自带清爽气质。' }
        ];

        function getIdols() {
            const saved = JSON.parse(localStorage.getItem('myIdols') || 'null');
            return saved || defaultIdols;
        }
        function saveIdols(list) {
            localStorage.setItem('myIdols', JSON.stringify(list));
        }

        function render() {
            const list = getIdols();
            const grid = document.getElementById('idolGrid');
            grid.innerHTML = '';
            list.forEach((idol, i) => {
                const card = document.createElement('div');
                card.className = 'idol-card';
                card.innerHTML = `
                    <img class="avatar" src="${idol.photo || 'zwj.jpg'}" alt="${idol.name}"
                         onerror="this.src='zwj.jpg'">
                    <div class="info">
                        <div class="name">${idol.name}</div>
                        <div class="desc">${idol.desc || '这位偶像还没有介绍'}</div>
                        <div class="actions">
                            <button onclick="alert('为 ${idol.name} 打call！❤️')">打call</button>
                            <button class="del" onclick="delIdol(${i})">删除</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal() { document.getElementById('modalMask').classList.add('show'); }
        function closeModal() {
            document.getElementById('modalMask').classList.remove('show');
            document.getElementById('newName').value = '';
            document.getElementById('newPhoto').value = '';
            document.getElementById('newSchool').value = '';
            document.getElementById('newRole').value = '';
            document.getElementById('newHobby').value = '';
            document.getElementById('newBirthday').value = '';
            document.getElementById('newZodiac').value = '';
            document.getElementById('newWechat').value = '';
            document.getElementById('newDouyin').value = '';
            document.getElementById('newEmail').value = '';
            document.getElementById('newLocation').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newTitle').value = '';
            document.getElementById('newStatus').value = '';
            document.getElementById('newFanName').value = '';
            document.getElementById('newFeature').value = '';
            document.getElementById('newLabel').value = '';
        }

        function addIdol() {
            const name = document.getElementById('newName').value.trim();
            if (!name) { alert('名字不能为空'); return; }
            const photo = document.getElementById('newPhoto').value.trim() || 'zwj.jpg';
            const school = document.getElementById('newSchool').value.trim() || '未知学校';
            const role = document.getElementById('newRole').value.trim() || '学生';
            const hobby = document.getElementById('newHobby').value.trim() || '自由 / 热爱 / 生活';
            const birthday = document.getElementById('newBirthday').value || '2002-11-11';
            const zodiac = document.getElementById('newZodiac').value.trim() || '天蝎座';
            const wechat = document.getElementById('newWechat').value.trim() || 'unknown';
            const douyin = document.getElementById('newDouyin').value.trim() || '@unknown';
            const email = document.getElementById('newEmail').value.trim() || 'hello@unknown.com';
            const location = document.getElementById('newLocation').value.trim() || '未知城市';
            const desc = document.getElementById('newDesc').value.trim() || '这位人物还没有介绍';
            const title = document.getElementById('newTitle').value.trim() || '有光的人';
            const status = document.getElementById('newStatus').value.trim() || '安静、清爽、自然';
            const fanName = document.getElementById('newFanName').value.trim() || '粉丝';
            const feature = document.getElementById('newFeature').value.trim() || '温柔 / 有光 / 治愈';
            const label = document.getElementById('newLabel').value.trim() || '校草 / 少年感';
            const list = getIdols();
            list.push({
                name,
                photo,
                school,
                role,
                hobby,
                birthday,
                zodiac,
                wechat,
                douyin,
                email,
                location,
                status,
                title,
                subtitle: `${role} · 记录 · 日常`,
                intro: `${desc}。他/她有一种让人想靠近的气质，也很让人愿意留意细节。`,
                tags: [...new Set((hobby + ' ' + status).split(/[\s/，、]+/).filter(Boolean))].slice(0, 6),
                meta: [school, ...hobby.split(/[\s/，、]+/).filter(Boolean).slice(0, 3)],
                desc,
                fanName,
                feature,
                label,
                contact: { wechat, douyin, email, location }
            });
            saveIdols(list);
            closeModal();
            render();
        }

        function delIdol(i) {
            if (!confirm('确定要删除这个偶像吗？')) return;
            const list = getIdols();
            list.splice(i, 1);
            saveIdols(list);
            render();
        }

        render();
    </script>
</body>
</html>

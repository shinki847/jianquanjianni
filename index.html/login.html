<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 · 郑文键后援会</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg1: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
            --card: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.15);
            --gold1: #f6d365; --gold2: #fda085;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            color: #eee;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%; max-width: 420px;
            background: var(--card); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 28px; text-align: center;
            background: linear-gradient(90deg, var(--gold1), var(--gold2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 25px;
        }
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.25);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 25px;
        }
        .tabs button {
            flex: 1;
            padding: 10px;
            background: none; border: none;
            color: #aaa; font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            transition: all .3s;
        }
        .tabs button.active {
            background: linear-gradient(135deg, var(--gold1), var(--gold2));
            color: #1a1a2e; font-weight: bold;
        }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 14px; color: #ccc; margin-bottom: 6px; }
        .field input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff; font-size: 15px;
            outline: none;
        }
        .field input:focus { border-color: var(--gold1); }
        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--gold1), var(--gold2));
            color: #1a1a2e;
            border: none; border-radius: 25px;
            font-size: 16px; font-weight: bold;
            cursor: pointer;
            transition: transform .3s;
        }
        .submit-btn:hover { transform: translateY(-2px); }
        .msg {
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
        }
        .err { color: #ff6b6b; }
        .ok { color: #6bff9e; }
        .back { text-align: center; margin-top: 20px; }
        .back a { color: #8ecae6; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">欢迎回来 🌟</h1>

        <div class="tabs">
            <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
            <button id="tabReg" onclick="switchTab('reg')">注册新账号</button>
        </div>

        <!-- 登录表单 -->
        <div id="loginForm">
            <div class="field">
                <label>用户名</label>
                <input type="text" id="loginUser" placeholder="输入用户名">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" id="loginPass" placeholder="输入密码">
            </div>
            <button class="submit-btn" onclick="doLogin()">登 录</button>
        </div>

        <!-- 注册表单 -->
        <div id="regForm" style="display:none;">
            <div class="field">
                <label>用户名（2-10位）</label>
                <input type="text" id="regUser" placeholder="给自己起个粉丝名">
            </div>
            <div class="field">
                <label>密码（至少6位）</label>
                <input type="password" id="regPass" placeholder="设置密码">
            </div>
            <div class="field">
                <label>再输一次密码</label>
                <input type="password" id="regPass2" placeholder="确认密码">
            </div>
            <button class="submit-btn" onclick="doReg()">注 册</button>
        </div>

        <div class="msg" id="msg"></div>
        <div class="back"><a href="index.html">← 返回首页</a></div>
    </div>

    <script>
        // 用户数据存在 localStorage 的 'users' 里，是一个对象 {用户名: 密码}
        function getUsers() {
            return JSON.parse(localStorage.getItem('users') || '{}');
        }
        function saveUsers(u) {
            localStorage.setItem('users', JSON.stringify(u));
        }

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabReg').classList.toggle('active', !isLogin);
            document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
            document.getElementById('regForm').style.display = isLogin ? 'none' : 'block';
            document.getElementById('title').textContent = isLogin ? '欢迎回来 🌟' : '加入键圈 🌟';
            document.getElementById('msg').textContent = '';
        }

        function showMsg(text, type) {
            const m = document.getElementById('msg');
            m.textContent = text;
            m.className = 'msg ' + type;
        }

        function doReg() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value;
            const p2 = document.getElementById('regPass2').value;
            if (u.length < 2 || u.length > 10) return showMsg('用户名要2-10个字', 'err');
            if (p.length < 6) return showMsg('密码至少6位', 'err');
            if (p !== p2) return showMsg('两次密码不一样', 'err');
            const users = getUsers();
            if (users[u]) return showMsg('这个用户名已被注册', 'err');
            users[u] = p;
            saveUsers(users);
            showMsg('✅ 注册成功！请登录', 'ok');
            setTimeout(() => switchTab('login'), 800);
            document.getElementById('loginUser').value = u;
        }

        function doLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;
            const users = getUsers();
            if (!users[u]) return showMsg('用户名不存在', 'err');
            if (users[u] !== p) return showMsg('密码错误', 'err');
            localStorage.setItem('currentUser', u);
            showMsg('✅ 登录成功！跳转中...', 'ok');
            setTimeout(() => location.href = 'index.html', 600);
        }
    </script>
</body>
</html>

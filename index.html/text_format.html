<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字特效实验室 · 郑文键后援会</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg1: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
            --card: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.15);
            --gold1: #f6d365; --gold2: #fda085;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            color: #eee;
            padding-top: 70px;
        }
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(26,26,46,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 30px; z-index: 100;
        }
        nav .logo {
            font-weight: bold; font-size: 18px;
            background: linear-gradient(90deg, var(--gold1), var(--gold2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        nav .links { margin-left: auto; display: flex; gap: 20px; align-items: center; }
        nav .links a { color: #ddd; text-decoration: none; font-size: 14px; }
        nav .links a:hover, nav .links a.active { color: var(--gold1); }
        .card {
            max-width: 760px; margin: 0 auto;
            background: var(--card); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 30px; text-align: center;
            background: linear-gradient(90deg, var(--gold1), var(--gold2), var(--gold1));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            background-size: 200% 100%;
            -webkit-animation: rainbow 4s linear infinite;
            animation: rainbow 4s linear infinite;
            margin-bottom: 8px;
        }
        @-webkit-keyframes rainbow { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
        @keyframes rainbow { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
        .sub { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1; padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border); border-radius: 30px;
            color: #fff; font-size: 16px; outline: none;
        }
        input:focus { border-color: var(--gold1); }
        button.go {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--gold1), var(--gold2));
            color: #1a1a2e; border: none; border-radius: 30px;
            font-weight: bold; cursor: pointer; transition: transform .3s;
        }
        button.go:hover { transform: scale(1.05); }
        .preview-box {
            min-height: 120px; padding: 30px; margin: 20px 0;
            border-radius: 16px; background: rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 32px; font-weight: bold;
        }
        .style-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .style-list button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1); color: #fff;
            border: 1px solid var(--border); border-radius: 20px;
            cursor: pointer; font-size: 14px; transition: all .3s;
        }
        .style-list button:hover, .style-list button.active {
            background: var(--gold1); color: #1a1a2e;
        }
        .neon { color: #fff; text-shadow: 0 0 10px var(--gold1), 0 0 20px var(--gold1), 0 0 40px var(--gold2); }
        .rainbow {
            background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            background-size: 200% 100%;
            -webkit-animation: rainbow 3s linear infinite;
            animation: rainbow 3s linear infinite;
        }
        .fire {
            color: #ffcc00;
            text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300;
            animation: flicker 1s infinite alternate;
        }
        @keyframes flicker { from { text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300; } to { text-shadow: 0 0 20px #ffcc00, 0 0 40px #ff6600; } }
        .glitch { color: #fff; animation: glitch 1s infinite; }
        @keyframes glitch {
            0%,100% { text-shadow: 2px 0 #ff004c, -2px 0 #00e5ff; }
            25% { text-shadow: -2px 0 #ff004c, 2px 0 #00e5ff; }
            50% { text-shadow: 2px 2px #ff004c, -2px -2px #00e5ff; }
            75% { text-shadow: -2px 2px #ff004c, 2px -2px #00e5ff; }
        }
        .outline { color: transparent; -webkit-text-stroke: 2px var(--gold1); }
        .bubble { color: #8ecae6; text-shadow: 0 2px 0 #5fa8d3, 0 4px 0 #5fa8d3, 0 6px 10px rgba(0,0,0,0.5); }
        .love-section {
            margin-top: 30px; padding-top: 25px;
            border-top: 1px dashed var(--border); text-align: center;
        }
        .love-section h3 { color: var(--gold1); margin-bottom: 15px; }
        .love-text { font-size: 20px; color: #ffb6c1; line-height: 1.8; min-height: 60px; padding: 15px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">🌟 键圈后援会</div>
        <div class="links">
            <a href="index.html">首页</a>
            <a href="album.html">相册</a>
            <a href="idols.html">偶像广场</a>
            <a href="text_format.html" class="active">文字特效</a>
            <a href="form.html">粉丝注册</a>
            <span id="userBox"></span>
        </div>
    </nav>

    <div class="card">
        <h1>文字特效实验室</h1>
        <div class="sub">输入你想对哥哥说的话，选一种特效</div>

        <div class="input-row">
            <input type="text" id="textInput" value="郑文键哥哥最帅！">
            <button class="go" onclick="render()">生成</button>
        </div>

        <div class="style-list">
            <button onclick="setStyle('normal', this)">默认</button>
            <button onclick="setStyle('neon', this)">霓虹发光</button>
            <button onclick="setStyle('rainbow', this)">彩虹流动</button>
            <button onclick="setStyle('fire', this)">火焰</button>
            <button onclick="setStyle('glitch', this)">赛博故障</button>
            <button onclick="setStyle('outline', this)">描边</button>
            <button onclick="setStyle('bubble', this)">气泡</button>
        </div>

        <div class="preview-box" id="preview">郑文键哥哥最帅！</div>

        <div class="love-section">
            <h3>💘 随机一句粉丝情话</h3>
            <div class="love-text" id="loveText">点下面按钮，生成一句送给哥哥</div>
            <button class="go" onclick="genLove()">来一句</button>
        </div>
    </div>

    <script>
        (function initUserBox() {
            const u = localStorage.getItem('currentUser');
            const box = document.getElementById('userBox');
            if (u) {
                box.innerHTML = `<span style="color:var(--gold1);font-size:14px;">你好，${u} 👋</span> <a href="javascript:void(0)" onclick="logout()" style="font-size:13px;">退出</a>`;
            } else {
                box.innerHTML = `<a href="login.html" style="font-size:14px;">登录/注册</a>`;
            }
        })();
        function logout() { localStorage.removeItem('currentUser'); location.reload(); }

        let currentStyle = 'normal';
        function render() {
            const val = document.getElementById('textInput').value || '输入点东西吧';
            const box = document.getElementById('preview');
            box.textContent = val;
            box.className = 'preview-box ' + currentStyle;
        }
        function setStyle(s, btn) {
            currentStyle = s;
            document.querySelectorAll('.style-list button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }
        const loveLines = [
            "哥哥笑一下，我整个青春都亮了 ✨",
            "别人追星靠运气，我追星靠命——因为命里有郑文键",
            "我可以为哥哥一夜长大，也可以为哥哥一直幼稚",
            "山河远阔，人间烟火，无一是你，无一不是你",
            "哥哥不是星星，但哥哥是我整片星空",
            "今天也在为哥哥的腹肌心动 💪",
            "全世界最好的郑文键，不许你不自信",
            "你是我藏在日记本里最骄傲的秘密",
            "愿你被世界温柔以待，因为你就是温柔本身",
            "文键一出现，空气都变甜了 🍬"
        ];
        function genLove() {
            const i = Math.floor(Math.random() * loveLines.length);
            document.getElementById('loveText').textContent = loveLines[i];
        }
    </script>
</body>
</html>
